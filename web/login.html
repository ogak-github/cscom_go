<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSCom — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d1117;
      --card:   #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --dim:    #8b949e;
      --green:  #3fb950;
      --red:    #f85149;
      --blue:   #58a6ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px 28px;
      width: 100%;
      max-width: 340px;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: monospace;
      font-size: 14px;
      padding: 9px 11px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: var(--blue);
    }

    button {
      width: 100%;
      background: var(--blue);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      padding: 9px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }

    #err {
      color: var(--red);
      font-size: 12px;
      margin-top: 12px;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">Control System Commander</div>
  <div class="sub">Enter your access key to continue.</div>
  <label for="key">Access Key</label>
  <input id="key" type="password" placeholder="••••••••••••••••••••••••••••••••" autocomplete="current-password" />
  <button id="btn">Sign in</button>
  <div id="err"></div>
</div>
<script>
  const keyEl = document.getElementById('key')
  const btn   = document.getElementById('btn')
  const err   = document.getElementById('err')

  async function login() {
    err.textContent = ''
    btn.disabled = true
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: keyEl.value })
      })
      if (r.ok) {
        location.replace('/')
      } else {
        err.textContent = 'Invalid access key.'
        keyEl.select()
      }
    } catch {
      err.textContent = 'Connection error.'
    } finally {
      btn.disabled = false
    }
  }

  btn.addEventListener('click', login)
  keyEl.addEventListener('keydown', e => { if (e.key === 'Enter') login() })
  keyEl.focus()
</script>
</body>
</html>
