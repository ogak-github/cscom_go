<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSCom</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d1117;
      --card:   #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --dim:    #8b949e;
      --green:  #3fb950;
      --yellow: #d29922;
      --red:    #f85149;
      --blue:   #58a6ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.06em;
    }

    #ver {
      font-size: 11px;
      font-family: monospace;
      color: var(--dim);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      flex-shrink: 0;
    }

    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #dot.ok { background: var(--green); }

    #ts {
      margin-left: auto;
      color: var(--dim);
      font-size: 12px;
    }

    main {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .card.wide { grid-column: 1 / -1; }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--dim);
      margin-bottom: 12px;
    }

    /* ── progress bar ── */
    .row {
      display: grid;
      grid-template-columns: 120px 1fr 54px;
      align-items: center;
      column-gap: 8px;
      margin-bottom: 7px;
    }

    .row .lbl {
      font-family: monospace;
      font-size: 12px;
      color: var(--dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track {
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .ok   { color: var(--green); }
    .warn { color: var(--yellow); }
    .crit { color: var(--red); }

    .fill.ok   { background: var(--green); }
    .fill.warn { background: var(--yellow); }
    .fill.crit { background: var(--red); }

    .pct {
      font-family: monospace;
      font-size: 12px;
      text-align: right;
    }

    .sub {
      font-size: 11px;
      color: var(--dim);
      font-family: monospace;
      text-align: right;
      margin-top: -4px;
      margin-bottom: 8px;
    }

    .meta {
      font-size: 12px;
      color: var(--dim);
      margin-top: 6px;
    }

    /* ── network ── */
    .net-head {
      display: grid;
      grid-template-columns: 110px 1fr 1fr;
      column-gap: 8px;
      font-size: 11px;
      color: var(--dim);
      font-family: monospace;
      margin-bottom: 6px;
    }

    .net-row {
      display: grid;
      grid-template-columns: 110px 1fr 1fr;
      column-gap: 8px;
      align-items: center;
      margin-bottom: 5px;
      font-family: monospace;
      font-size: 13px;
    }

    .net-row .iface { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .net-row .rx    { color: var(--green); text-align: right; }
    .net-row .tx    { color: var(--dim);   text-align: right; }

    /* ── badge ── */
    .badge {
      font-size: 10px;
      color: var(--dim);
      background: var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      margin-left: 4px;
      font-family: monospace;
    }

    /* ── processes table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: monospace;
      font-size: 13px;
    }

    th {
      text-align: left;
      color: var(--dim);
      font-weight: 400;
      padding: 0 8px 8px 0;
      border-bottom: 1px solid var(--border);
    }

    th:last-child, td:last-child { text-align: right; padding-right: 0; }

    td {
      padding: 5px 8px 5px 0;
      border-bottom: 1px solid #21262d;
    }

    tr:last-child td { border-bottom: none; }

    td.pid  { color: var(--dim); width: 60px; }
    td.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
    td.cpu  { width: 70px; }
    td.mem  { width: 80px; color: var(--dim); }

    .empty { color: var(--dim); font-size: 13px; padding: 4px 0; }

    /* ── system info rows ── */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 5px 0;
      border-bottom: 1px solid #21262d;
      font-size: 13px;
      gap: 12px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .key { color: var(--dim); flex-shrink: 0; }
    .info-row .val { color: var(--text); text-align: right; font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>Control System Commander (CSCom)</h1>
  <span id="ver"></span>
  <span id="ts">Connecting…</span>
</header>

<main>
  <div class="card" id="sys"><div class="card-title">System</div><div class="empty">—</div></div>
  <div class="card" id="cpu"><div class="card-title">CPU</div><div class="empty">—</div></div>
  <div class="card" id="fans" style="display:none"><div class="card-title">Fans</div><div class="empty">—</div></div>
  <div class="card" id="ram"><div class="card-title">RAM</div><div class="empty">—</div></div>
  <div class="card" id="gpu" style="display:none"><div class="card-title">GPU</div><div class="empty">—</div></div>
  <div class="card" id="disk"><div class="card-title">Disk</div><div class="empty">—</div></div>
  <div class="card" id="net"><div class="card-title">Network</div><div class="empty">—</div></div>
  <div class="card wide" id="proc"><div class="card-title">Processes</div><div class="empty">—</div></div>
  <div class="card wide" id="docker" style="display:none"><div class="card-title">Docker</div><div class="empty">—</div></div>
</main>

<script>
  const $ = id => document.getElementById(id)

  function tier(p) { return p >= 80 ? 'crit' : p >= 60 ? 'warn' : 'ok' }

  function pct(p) { return `<span class="pct ${tier(p)}">${p.toFixed(1)}%</span>` }

  function bytes(b) {
    if (!b) return '0B'
    const u = ['B','KB','MB','GB','TB']
    const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), u.length - 1)
    return (b / 1024 ** i).toFixed(1) + u[i]
  }

  function bar(p) {
    const t = tier(p)
    return `<div class="track"><div class="fill ${t}" style="width:${Math.min(p,100).toFixed(2)}%"></div></div>`
  }

  function row(label, p, sub) {
    return `
      <div class="row">
        <span class="lbl" title="${label}">${label}</span>
        ${bar(p)}
        ${pct(p)}
      </div>${sub ? `<div class="sub">${sub}</div>` : ''}`
  }

  function infoRow(key, val) {
    return `<div class="info-row"><span class="key">${key}</span><span class="val">${val}</span></div>`
  }

  function fmtUptime(s) {
    const d = Math.floor(s / 86400)
    const h = Math.floor((s % 86400) / 3600)
    const m = Math.floor((s % 3600) / 60)
    if (d > 0) return `${d}d ${h}h ${m}m`
    if (h > 0) return `${h}h ${m}m`
    return `${m}m`
  }

  function renderSystem(s, c) {
    let h = '<div class="card-title">System</div>'
    h += infoRow('Version', appVersion || '—')
    h += infoRow('Platform', s.platform || '—')
    h += infoRow('Arch', s.arch || '—')
    h += infoRow('Hostname', s.hostname || '—')
    if (c.uptime) h += infoRow('Uptime', fmtUptime(c.uptime))
    if (c.model)  h += infoRow('CPU', c.model)
    h += infoRow('Cores', c.cores)
    return h
  }

  function renderCPU(c) {
    let h = '<div class="card-title">CPU</div>'
    if (c.model) h += `<div class="meta" style="margin-bottom:10px">${c.model}</div>`
    const cores = c.per_core || []
    cores.forEach((p, i) => { h += row(`Core ${i}`, p) })
    h += `<div class="meta">Load: ${c.load1.toFixed(2)} / ${c.load5.toFixed(2)} / ${c.load15.toFixed(2)}`
    if (c.uptime) h += `<span style="margin-left:16px">Up: ${fmtUptime(c.uptime)}</span>`
    if (c.temp_c >= 0) h += `<span style="margin-left:16px">Temp: ${c.temp_c.toFixed(0)}°C</span>`
    h += '</div>'
    return h
  }

  function renderFans(fans) {
    const el = $('fans')
    if (!fans || !fans.length) {
      el.style.display = 'none'
      return
    }
    el.style.display = ''
    let h = '<div class="card-title">Fans</div>'
    for (const f of fans)
      h += infoRow(f.label, `${f.rpm} RPM`)
    el.innerHTML = h
  }

  function renderRAM(r) {
    let h = '<div class="card-title">RAM</div>'
    h += row('Memory', r.used_pct, `${bytes(r.used)} / ${bytes(r.total)}`)
    h += `<div class="sub" style="margin-bottom:10px">avail: ${bytes(r.available)}</div>`
    if (r.swap_total > 0) {
      h += row('Swap', r.swap_pct, `${bytes(r.swap_used)} / ${bytes(r.swap_total)}`)
      h += `<div class="sub">avail: ${bytes(r.swap_total - r.swap_used)}</div>`
    }
    return h
  }

  function gpuRow(label, p, sub) {
    if (p < 0) {
      return `
        <div class="row">
          <span class="lbl" title="${label}">${label}</span>
          <span class="sub" style="margin:0;grid-column:2/4;text-align:left">n/a</span>
        </div>`
    }
    return row(label, p, sub)
  }

  function renderGpu(gpus) {
    const el = $('gpu')
    if (!gpus || !gpus.length) {
      el.style.display = 'none'
      return
    }
    el.style.display = ''
    let h = '<div class="card-title">GPU</div>'
    for (const g of gpus) {
      h += `<div class="meta" style="margin-bottom:6px">${g.vendor} ${g.name}</div>`
      h += gpuRow('Util', g.util_pct)
      h += g.mem_total > 0
        ? gpuRow('Mem', g.mem_pct, `${bytes(g.mem_used)} / ${bytes(g.mem_total)}`)
        : gpuRow('Mem', -1)
      let extra = []
      if (g.temp_c >= 0) extra.push(`${g.temp_c.toFixed(0)}°C`)
      if (g.fan_pct >= 0) extra.push(`Fan ${g.fan_pct.toFixed(0)}%`)
      if (extra.length) h += `<div class="sub" style="text-align:left;margin-bottom:8px">${extra.join('  ·  ')}</div>`
    }
    el.innerHTML = h
  }

  function renderDisk(disks) {
    let h = '<div class="card-title">Disk</div>'
    if (!disks || !disks.length) return h + '<div class="empty">No disks</div>'
    for (const d of disks)
      h += row(d.mountpoint, d.used_pct,
        `${bytes(d.used)} / ${bytes(d.total)}<span class="badge">${d.fstype}</span>`)
    return h
  }

  function renderNet(nets) {
    let h = '<div class="card-title">Network</div>'
    if (!nets || !nets.length) return h + '<div class="empty">No interfaces</div>'
    h += `<div class="net-head"><span>Interface</span><span style="text-align:right">↓ RX/s</span><span style="text-align:right">↑ TX/s</span></div>`
    for (const n of nets)
      h += `<div class="net-row">
        <span class="iface">${n.name}</span>
        <span class="rx">${bytes(n.rx_rate)}/s</span>
        <span class="tx">${bytes(n.tx_rate)}/s</span>
      </div>`
    return h
  }

  function renderProc(procs) {
    let h = '<div class="card-title">Processes</div>'
    if (!procs || !procs.length) return h + '<div class="empty">No processes</div>'
    // PSS is Linux-only and needs permission on the target process, so the
    // column is dropped entirely when nothing could be read.
    const showPss = procs.some(p => p.mem_pss > 0)
    h += `<table><thead><tr>
      <th>PID</th><th>Name</th><th>CPU%</th>
      <th style="text-align:right" title="Resident set size - includes memory shared with other processes">RSS</th>
      ${showPss ? '<th title="Proportional set size - private memory plus a fair share of shared memory">PSS</th>' : ''}
    </tr></thead><tbody>`
    for (const p of procs)
      h += `<tr>
        <td class="pid">${p.pid}</td>
        <td class="name" title="${p.name}">${p.name}</td>
        <td class="cpu ${tier(p.cpu)}">${p.cpu.toFixed(1)}%</td>
        <td class="mem" style="text-align:right">${bytes(p.mem_rss)}</td>
        ${showPss ? `<td class="mem">${p.mem_pss > 0 ? bytes(p.mem_pss) : '-'}</td>` : ''}
      </tr>`
    h += '</tbody></table>'
    return h
  }

  function renderDocker(containers) {
    const el = $('docker')
    if (!containers || !containers.length) {
      el.style.display = 'none'
      return
    }
    el.style.display = ''
    let h = '<div class="card-title">Docker</div>'
    h += `<table><thead><tr>
      <th>ID</th><th>Name</th><th>Image</th><th>CPU%</th><th>Memory</th><th style="text-align:right">NET ↓</th><th style="text-align:right">NET ↑</th>
    </tr></thead><tbody>`
    for (const c of containers) {
      const memStr = c.mem_limit > 0
        ? `${bytes(c.mem_used)} / ${bytes(c.mem_limit)}`
        : bytes(c.mem_used)
      h += `<tr>
        <td class="pid" title="${c.id}">${c.id}</td>
        <td class="name" title="${c.name}">${c.name}</td>
        <td class="name" title="${c.image}" style="color:var(--dim)">${c.image}</td>
        <td class="cpu ${tier(c.cpu_pct)}">${c.cpu_pct.toFixed(1)}%</td>
        <td class="mem">${memStr}</td>
        <td class="mem" style="color:var(--green);text-align:right">${bytes(c.net_rx)}</td>
        <td class="mem" style="text-align:right">${bytes(c.net_tx)}</td>
      </tr>`
    }
    h += '</tbody></table>'
    el.innerHTML = h
  }

  function render(snap) {
    $('sys').innerHTML  = renderSystem(snap.system, snap.cpu)
    $('cpu').innerHTML  = renderCPU(snap.cpu)
    renderFans(snap.fans)
    $('ram').innerHTML  = renderRAM(snap.ram)
    renderGpu(snap.gpus)
    $('disk').innerHTML = renderDisk(snap.disks)
    $('net').innerHTML  = renderNet(snap.networks)
    $('proc').innerHTML = renderProc(snap.processes)
    renderDocker(snap.containers)
    $('ts').textContent = 'Updated ' + new Date().toLocaleTimeString()
  }

  // App version comes from the server build, not the metrics stream.
  let appVersion = ''

  fetch('/api/version')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.version) return
      appVersion = d.version
      $('ver').textContent = d.version
    })
    .catch(() => {})

  // Load initial snapshot from REST so cards fill instantly.
  // A 401 means the session is gone — send to login.
  fetch('/api/metrics')
    .then(r => {
      if (r.status === 401) { location.replace('/login'); return null }
      return r.json()
    })
    .then(data => { if (data) render(data) })
    .catch(() => {})

  // WebSocket with exponential backoff reconnect
  let retryMs = 1000

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
    const ws = new WebSocket(`${proto}//${location.host}/ws`)

    ws.onopen = () => {
      $('dot').className = 'ok'
      $('ts').textContent = 'Live'
      retryMs = 1000
    }

    ws.onmessage = e => {
      try { render(JSON.parse(e.data)) } catch(err) { console.error('render:', err) }
    }

    // only reconnect in onclose — onerror always precedes onclose, so we don't
    // double-schedule and accidentally grow retryMs twice per failure
    ws.onerror = () => {}
    ws.onclose = () => {
      $('dot').className = ''
      $('ts').textContent = `Reconnecting in ${retryMs / 1000}s…`
      setTimeout(connect, retryMs)
      retryMs = Math.min(retryMs * 2, 16000)
    }
  }

  connect()
</script>
</body>
</html>
